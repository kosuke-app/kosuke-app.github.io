<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="kosuke-app が開発している iOS アプリの一覧です。">
<title>kosuke-app</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1d1d1f; --sub: #6e6e73; --card: #f5f5f7; --link: #0066cc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000000; --fg: #f5f5f7; --sub: #a1a1a6; --card: #1c1c1e; --link: #2997ff; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; line-height: 1.7; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 1.8rem; margin: 0 0 4px; }
  .lead { color: var(--sub); margin: 0 0 32px; }
  .app { background: var(--card); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
  .app h2 { font-size: 1.2rem; margin: 0 0 4px; }
  .app p { margin: 0 0 8px; color: var(--sub); }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .links a { margin-right: 16px; }
  footer { margin-top: 40px; color: var(--sub); font-size: 0.9rem; }
</style>
</head>
<body>
<main>
  <h1>kosuke-app</h1>
  <p class="lead">個人で開発している iOS アプリの一覧です。</p>

  <section class="app">
    <h2>マウスピース手帳</h2>
    <p>マウスピース矯正の交換日と装着時間を管理するアプリです。</p>
    <div class="links">
      <a href="mouthpiece-privacy/support.html">サポート</a>
      <a href="mouthpiece-privacy/">プライバシーポリシー</a>
    </div>
  </section>

  <section class="app">
    <h2>ころもじ</h2>
    <p>ひらがなを落として、同じ文字を合体させるパズルゲームです。</p>
    <div class="links">
      <a href="mojikoro-support/">サポート</a>
      <a href="mojikoro-support/privacy.html">プライバシーポリシー</a>
    </div>
  </section>

  <footer>
    お問い合わせ: <a href="mailto:kosuke.support@gmail.com">kosuke.support@gmail.com</a>
  </footer>
</main>
</body>
</html>
